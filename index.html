<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiniela Liga MX · Apertura 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700;1,800&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ════════════════════════════════════════════════════════════
   QUINIELA LIGA MX · styles.css  v3.1
   Diseño: Elegante, moderno, fiel a Liga MX
   Paleta: Cian #60D8DF · Amarillo #FFF52D · Blanco #fff
   Tipografía: Barlow Condensed (display) + Barlow (body)
════════════════════════════════════════════════════════════ */

/* ── Variables globales ── */
:root {
  --verde:         #60D8DF;
  --verde-deep:    #1A6E73;
  --verde-mid:     #3FC2C9;
  --verde-lite:    #E5FBFC;
  --dorado:        #FFF52D;
  --dorado-dark:   #D4CC00;
  --dorado-lite:   #FFFDE0;
  --dorado-mid:    #FFF866;
  --rojo:          #c0392b;
  --blanco:        #ffffff;
  --gris-bg:       #f2f5f3;
  --gris-borde:    #e0e8e4;
  --gris-texto:    #5a6b63;
  --gris-dark:     #374740;
  --negro:         #1a2620;

  --sombra-card:   0 8px 40px rgba(96,216,223,.14), 0 2px 8px rgba(96,216,223,.08);
  --sombra-fab:    0 6px 20px rgba(96,216,223,.5);
  --radius:        16px;
  --radius-sm:     10px;
  --radius-xs:     6px;
  --trans:         .22s cubic-bezier(.4,0,.2,1);
  --font-cond:     'Barlow Condensed', sans-serif;
  --font-body:     'Barlow', sans-serif;

  /* Contorno negro tipo "stroke" para textos amarillos/azules */
  --text-stroke:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000,
     0   -1.5px 0 #000,
     0    1.5px 0 #000,
    -1.5px 0   0 #000,
     1.5px 0   0 #000;
}

/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

body {
  background: var(--gris-bg);
  font-family: var(--font-body);
  color: var(--negro);
  min-height: 100vh;
  padding: 24px 16px 80px;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 85% 5%, rgba(96,216,223,.09) 0%, transparent 45%),
    radial-gradient(ellipse at 8% 95%, rgba(255,245,45,.08) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

main {
  position: relative;
  z-index: 1;
  max-width: 880px;
  margin: 0 auto;
}

/* ════════════════════════════════════════════════════════════
   MODAL
════════════════════════════════════════════════════════════ */
.modal {
  position: fixed;
  inset: 0;
  z-index: 9000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(3,18,10,.82);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal-box {
  position: relative;
  background: var(--blanco);
  border-radius: 22px;
  padding: 36px 32px 28px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  box-shadow: 0 28px 80px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);
  animation: modalIn .45s cubic-bezier(.34,1.4,.64,1) both;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(.78) translateY(24px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-logo {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.modal-hexagon {
  width: 68px;
  height: 68px;
  background: linear-gradient(135deg, var(--verde) 0%, var(--verde-mid) 100%);
  clip-path: polygon(50% 0%, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  box-shadow: 0 8px 24px rgba(96,216,223,.4);
  animation: hexPulse 3s ease-in-out infinite;
}

@keyframes hexPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(96,216,223,.4); }
  50% { transform: scale(1.04); box-shadow: 0 12px 32px rgba(96,216,223,.55); }
}

.modal-title-line1 {
  display: block;
  font-family: var(--font-cond);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--gris-texto);
  text-transform: uppercase;
}

.modal-title-line2 {
  display: block;
  font-family: var(--font-cond);
  font-size: 42px;
  font-weight: 900;
  line-height: 1;
  color: var(--verde);
  text-transform: uppercase;
  letter-spacing: -0.5px;
  text-shadow: var(--text-stroke);
}

.modal-title-season {
  display: block;
  font-family: var(--font-cond);
  font-size: 16px;
  font-weight: 600;
  font-style: italic;
  color: var(--dorado);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 2px;
  margin-bottom: 16px;
  text-shadow: var(--text-stroke);
}

.modal-subtitle {
  font-size: 14px;
  color: var(--gris-texto);
  margin-bottom: 18px;
}

.modal-input-wrap {
  position: relative;
  margin-bottom: 14px;
}

.input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 17px;
  pointer-events: none;
  opacity: 0.6;
}

.modal-input-wrap input {
  width: 100%;
  padding: 13px 16px 13px 42px;
  border: 2px solid var(--gris-borde);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  color: var(--negro);
  outline: none;
  transition: border-color var(--trans), box-shadow var(--trans);
  background: #fafcfb;
}

.modal-input-wrap input:focus {
  border-color: var(--verde);
  background: var(--blanco);
  box-shadow: 0 0 0 4px rgba(96,216,223,.1);
}

.modal-input-wrap input::placeholder { color: #b0bdb8; }

.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--verde) 0%, var(--verde-mid) 100%);
  color: var(--blanco);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-cond);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--trans);
  box-shadow: 0 4px 16px rgba(96,216,223,.38);
  position: relative;
  overflow: hidden;
}

.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.12) 0%, transparent 100%);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(96,216,223,.5);
}

.btn-primary:active { transform: translateY(0); }

.modal-hint {
  margin-top: 14px;
  font-size: 12px;
  color: #aab5b0;
  font-style: italic;
}

.modal-hint strong { color: var(--verde); font-style: normal; text-shadow: var(--text-stroke); }

/* ════════════════════════════════════════════════════════════
   TARJETA QUINIELA
   CRÍTICO: Sin backdrop-filter, sin position:fixed interno.
   html2canvas captura .quiniela limpiamente.
════════════════════════════════════════════════════════════ */

.quiniela {
  background: var(--blanco);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--sombra-card);
  border: 1.5px solid var(--gris-borde);
  /* Ancho fluido para PNG consistente, mucho más ancha que antes */
  width: 100%;
  max-width: 840px;
  margin: 0 auto;
}

/* ── HEADER ── */
.q-header {
  background: var(--verde-deep);
  color: var(--blanco);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 16px 18px 16px;
  position: relative;
  overflow: hidden;
}

/* Patrón hexagonal de fondo (CSS puro, html2canvas lo soporta) */
.q-header-bg {
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      60deg,
      transparent,
      transparent 18px,
      rgba(255,245,45,.05) 18px,
      rgba(255,245,45,.05) 19px
    ),
    repeating-linear-gradient(
      -60deg,
      transparent,
      transparent 18px,
      rgba(255,245,45,.05) 18px,
      rgba(255,245,45,.05) 19px
    );
  pointer-events: none;
}

/* Columna izquierda: Logo */
.q-col-left {
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.q-logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,.12);
  border: 2px solid rgba(255,245,45,.35);
  overflow: hidden;
  flex-shrink: 0;
}

.q-logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 50%;
}

/* Columna central: título (con padding simétrico para centrado real) */
.q-col-center {
  text-align: center;
}

.q-season {
  font-family: var(--font-cond);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  color: rgba(255,255,255,.55);
  text-transform: uppercase;
  margin-bottom: 2px;
}

#tituloJornada {
  font-family: var(--font-cond);
  font-size: 30px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0;
  color: var(--dorado);
  line-height: 1;
  text-shadow: var(--text-stroke);
}

.q-title-accent {
  width: 32px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--dorado), transparent);
  margin: 4px auto 0;
}

/* Columna derecha: jugador */
.q-col-right {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  min-width: 0;
}

.q-jugador-label {
  display: block;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.2px;
  color: rgba(255,255,255,.5);
  text-transform: uppercase;
  margin-bottom: 2px;
  white-space: nowrap;
}

#nombreJugador {
  font-family: var(--font-cond);
  font-size: 17px;
  font-weight: 800;
  color: var(--dorado);
  text-transform: uppercase;
  word-break: break-word;
  max-width: 160px;
  text-align: right;
  line-height: 1.1;
  text-shadow: var(--text-stroke);
}

/* Franja dorada */
.q-stripe {
  height: 5px;
  background: var(--verde-deep);
  display: flex;
  align-items: center;
  justify-content: center;
}

.q-stripe-inner {
  width: 100%;
  height: 3px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--dorado-dark) 10%,
    var(--dorado) 30%,
    var(--dorado-mid) 50%,
    var(--dorado) 70%,
    var(--dorado-dark) 90%,
    transparent 100%
  );
}

/* ════════════════════════════════════════════════════════════
   PARTIDOS
════════════════════════════════════════════════════════════ */
.partidos-grid {
  padding: 0;
  background: var(--blanco);
}

.partido {
  border-bottom: 1px solid var(--gris-borde);
  padding: 14px 18px 18px;
  position: relative;
  background: var(--blanco);
  /* Animación de entrada */
  animation: fadeSlideUp .4s ease both;
}

.partido:last-child { border-bottom: none; }

.partido:nth-child(odd) {
  background: #fafcfb;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.partido:nth-child(1)  { animation-delay: .05s; }
.partido:nth-child(2)  { animation-delay: .10s; }
.partido:nth-child(3)  { animation-delay: .15s; }
.partido:nth-child(4)  { animation-delay: .20s; }
.partido:nth-child(5)  { animation-delay: .25s; }
.partido:nth-child(6)  { animation-delay: .30s; }
.partido:nth-child(7)  { animation-delay: .35s; }
.partido:nth-child(8)  { animation-delay: .40s; }
.partido:nth-child(9)  { animation-delay: .45s; }

/* Número de partido */
.partido-num {
  position: absolute;
  left: 16px;
  top: 13px;
  font-family: var(--font-cond);
  font-size: 12px;
  font-weight: 700;
  color: var(--dorado);
  letter-spacing: .3px;
  opacity: 0.9;
  text-shadow: var(--text-stroke);
}

/* Fila info (fecha · hora · canales) — debajo del marcador */
.p-info-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 12px;
  padding-left: 0;
  flex-wrap: wrap;
  min-height: 18px;
}

.p-fecha {
  font-family: var(--font-cond);
  font-size: 14px;
  font-weight: 800;
  color: var(--gris-texto);
  letter-spacing: .4px;
  text-transform: uppercase;
  white-space: nowrap;
}

.p-hora {
  font-family: var(--font-cond);
  font-size: 14px;
  font-weight: 800;
  color: var(--verde-mid);
  white-space: nowrap;
  text-shadow: var(--text-stroke);
}

.p-sep {
  color: var(--gris-borde);
  font-size: 12px;
}

/* Contenedor de hasta 4 canales */
.p-canales-container {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
}

/* Canal */
.p-canal-wrap {
  margin-left: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.canal-logo {
  height: 20px;
  width: auto;
  max-width: 56px;
  object-fit: contain;
  display: block;
}

.canal-text {
  font-family: var(--font-cond);
  font-size: 13px;
  font-weight: 800;
  color: var(--verde-deep);
  letter-spacing: .3px;
  text-transform: uppercase;
  background: var(--verde-lite);
  padding: 2px 8px;
  border-radius: 3px;
}

/* Fila central del partido */
.fila-partido {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* Equipo */
.equipo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 150px;
  flex-shrink: 0;
}

.equipo img {
  width: 82px;
  height: 82px;
  object-fit: contain;
  display: block;
}

.equipo-nombre {
  font-family: var(--font-cond);
  font-size: 15px;
  font-weight: 800;
  color: var(--gris-dark);
  text-transform: uppercase;
  letter-spacing: .3px;
  text-align: center;
  line-height: 1.15;
  max-width: 142px;
  overflow: visible;
  text-overflow: unset;
  white-space: normal;
}

/* Score central */
.score-zone {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 0;
}

.score-wrap {
  display: flex;
  align-items: center;
}

/* SCORE EDITABLE
   CRÍTICO: contenteditable se desactiva antes de exportar.
   Sin outline complicado que confunda a html2canvas. */
.score {
  width: 66px;
  height: 66px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(96,216,223,.25);
  border-radius: var(--radius-sm);
  font-family: var(--font-cond);
  font-size: 38px;
  font-weight: 800;
  color: var(--verde);
  cursor: text;
  outline: none;
  caret-color: var(--dorado);
  -webkit-user-select: text;
  user-select: text;
  line-height: 1;
  text-align: center;
  background: var(--blanco);
  transition: border-color var(--trans), background var(--trans), color var(--trans);
  text-shadow: var(--text-stroke);
}

.score:focus {
  border-color: var(--dorado);
  background: var(--dorado-lite);
  color: var(--gris-dark);
  box-shadow: 0 0 0 3px rgba(255,245,45,.18);
  text-shadow: none;
}

/* Divisor central entre scores */
.score-divider {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0 10px;
}

.score-divider-dash {
  width: 14px;
  height: 2px;
  background: var(--gris-borde);
  border-radius: 1px;
}

.vs-text {
  font-family: var(--font-cond);
  font-size: 11px;
  font-weight: 900;
  color: #ccc;
  letter-spacing: 1.5px;
}

/* ── Footer de la tarjeta ── */
.q-footer {
  background: var(--verde-deep);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-cond);
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,.55);
  letter-spacing: .6px;
  text-transform: uppercase;
}

.q-footer-left {
  display: flex;
  align-items: center;
  gap: 6px;
}

.q-footer-sep {
  width: 1px;
  height: 12px;
  background: rgba(255,255,255,.2);
}

.q-footer-right {
  color: rgba(255,255,255,.4);
}

/* ════════════════════════════════════════════════════════════
   BOTONES DE ACCIÓN (fuera de la tarjeta)
════════════════════════════════════════════════════════════ */
.acciones {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.btn-accion {
  flex: 1;
  min-width: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-cond);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .8px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--trans);
  position: relative;
  overflow: hidden;
}

.btn-accion::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.1) 0%, transparent 100%);
}

.btn-guardar {
  background: linear-gradient(135deg, var(--verde) 0%, var(--verde-mid) 100%);
  color: var(--blanco);
  box-shadow: 0 4px 16px rgba(96,216,223,.35);
}

.btn-guardar:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(96,216,223,.5);
}

.btn-guardar:active { transform: translateY(0); }

.btn-compartir {
  background: linear-gradient(135deg, var(--dorado-dark) 0%, var(--dorado-mid) 100%);
  color: #3a2200;
  box-shadow: 0 4px 16px rgba(255,245,45,.35);
}

.btn-compartir:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(255,245,45,.5);
}

.btn-compartir:active { transform: translateY(0); }

/* ════════════════════════════════════════════════════════════
   TOAST (notificación)
════════════════════════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--verde-deep);
  color: var(--blanco);
  font-family: var(--font-cond);
  font-size: 15px;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 100px;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s, transform .3s;
  z-index: 9999;
  white-space: nowrap;
  max-width: calc(100vw - 48px);
  text-align: center;
  border: 1px solid rgba(255,245,45,.3);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ════════════════════════════════════════════════════════════
   FAB ADMIN
════════════════════════════════════════════════════════════ */
.admin-fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--verde) 0%, var(--verde-mid) 100%);
  color: var(--blanco);
  border: 2px solid rgba(255,245,45,.4);
  font-size: 22px;
  cursor: pointer;
  z-index: 8000;
  box-shadow: var(--sombra-fab);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--trans);
}

.admin-fab:hover {
  transform: scale(1.1) rotate(30deg);
  box-shadow: 0 10px 28px rgba(96,216,223,.65);
}

.admin-fab:active { transform: scale(1); }

/* ════════════════════════════════════════════════════════════
   PANEL ADMIN
   Controlado 100% por JS con style.display. Sin admin-only.

.admin-panel {
  position: fixed;
  right: 20px;
  bottom: 92px;
  width: 320px;
  max-height: 75vh;
  display: flex;
  flex-direction: column;
  background: #111d17;
  border: 1px solid rgba(255,245,45,.18);
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
  z-index: 8500;
  overflow: hidden;
  font-family: var(--font-body);
  font-size: 14px;
  animation: panelIn .25s cubic-bezier(.34,1.25,.64,1) both;
}

@keyframes panelIn {
  from { opacity: 0; transform: translateY(16px) scale(.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.ap-header {
  display: flex;
  align-items: center;
  gap: 10px;

.ap-header-text { flex: 1; }

.ap-header-text h3 {
  font-family: var(--font-cond);

  font-weight: 800;
  color: var(--blanco);
  letter-spacing: .5px;
  line-height: 1.1;
}

.ap-header-text span {
  font-size: 11px;
  color: rgba(255,255,255,.35);
  letter-spacing: .3px;
}

.ap-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: none;
  color: rgba(255,255,255,.7);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--trans), color var(--trans);
  flex-shrink: 0;
}

.ap-close:hover {
  background: rgba(255,255,255,.18);
  color: var(--blanco);
}

.ap-body {
  overflow-y: auto;

.ap-section { padding: 14px 16px 6px; }
.ap-danger-section { padding-top: 10px; }

.ap-divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,.06);
  margin: 8px 0;

.ap-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .8px;

  color: rgba(255,255,255,.38);
  margin-bottom: 7px;
  margin-top: 12px;

.ap-label:first-child { margin-top: 0; }
.ap-label-danger { color: rgba(192,57,43,.7); }

.ap-input-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}

.ap-input-row .ap-input { flex: 1; }

.ap-btn-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-xs);
  background: var(--verde);
  border: none;
  color: var(--blanco);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background var(--trans);
}

.ap-btn-icon:hover { background: var(--verde-mid); }

.ap-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.ap-form-col { display: flex; flex-direction: column; }
.ap-form-col .ap-label { margin-top: 0; }

.ap-input,
.ap-select {
  width: 100%;
  padding: 9px 11px;
  border-radius: var(--radius-xs);
  border: 1.5px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.06);

  font-size: 13.5px;

.ap-input:focus,

.ap-input::placeholder { color: rgba(255,255,255,.25); }
.ap-select option { background: #111d17; color: var(--blanco); }

.ap-partido-form {
  padding: 0 16px;
  border-top: 1px solid rgba(255,255,255,.06);
  margin-top: 10px;
  padding-top: 12px;
}

.ap-btn-danger {
  width: 100%;
  padding: 10px;

  border: 1px solid rgba(192,57,43,.4);
  color: #e57373;

/**
 * Ruta al logo de un equipo.
 * Coloca los archivos PNG en: assets/equipos/<id>.png
 * Si no existe, el onerror del <img> usará el fallback.
 */
const logoEquipo  = id => `assets/equipos/${id}.jpeg`;

/**
 * Ruta al logo de un canal.
 * Coloca los archivos PNG en: assets/canales/<id>.png
 */
const logoCanal   = id => `assets/canales/${id}.png`;

const shortEquipo  = id => (EQUIPOS.find(e => e.id === id) || {}).short  || id.toUpperCase().slice(0, 3);
const nombreEquipo = id => (EQUIPOS.find(e => e.id === id) || {}).nombre || id;
const nombreCanal  = id => (CANALES.find(c => c.id === id) || {}).nombre || id.toUpperCase();

/** "2025-02-14" → "VIE 14 FEB" */
function formatFecha(iso) {
  if (!iso) return 'Por definir';
  // Usar T12:00:00 para evitar desfase de zona horaria
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('es-MX', {
    weekday: 'short', day: 'numeric', month: 'short',
  }).replace(/\./g, '').toUpperCase();
}

/** "20:00" → "20:00 h" */
const formatHora = t => t ? t + ' h' : '';

/** Normaliza un partido para asegurar que siempre tenga un array
 *  "canales" (máx. 4). Convierte el antiguo campo "canal" (string)
 *  a array si es necesario, para no romper datos guardados previos. */
function normalizarCanales(p) {
  if (Array.isArray(p.canales) && p.canales.length) {
    return p.canales.filter(Boolean).slice(0, 4);
  }
  if (p.canal) {
    return [p.canal];
  }
  return ['tudn'];
}

/** Genera el HTML de hasta 4 bloques de canal (logo + fallback texto) */
function canalesHTML(canalesArr) {
  const arr = (canalesArr && canalesArr.length ? canalesArr : []).slice(0, 4);
  return arr.map(cid => {
    const nom = nombreCanal(cid);
    return `<div class="p-canal-wrap">
        <img
          class="canal-logo"
          src="${logoCanal(cid)}"
          alt="${nom}"
          title="${nom}"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';"
        >
        <span class="canal-text" style="display:none;">${nom}</span>
      </div>`;
  }).join('');
}

/** Muestra un toast temporal */
function toast(msg, duracion = 2800) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duracion);
}

/** Captura el estado actual de los partidos del DOM */
function obtenerEstadoActual() {
  const partidos = Array.from(document.querySelectorAll('.partido')).map(p => {
    let canales = ['tudn'];
    try { canales = JSON.parse(p.dataset.canales || '["tudn"]'); } catch (e) { canales = ['tudn']; }

/* ══════════════════════════════════════════════════════════
   6. EVENTOS SCORES
══════════════════════════════════════════════════════════ */

function activarEventosScore() {
  document.querySelectorAll('.score').forEach(score => {

    /** Filtra solo dígitos, máximo 2 */
    score.addEventListener('input', () => {
      const limpio = score.textContent.replace(/\D/g, '').slice(0, 2);
      if (score.textContent !== limpio) {
        score.textContent = limpio || '0';
        moverCursorAlFinal(score);
      }
    });

    /** Al enfocar, borra el 0 inicial */
    score.addEventListener('focus', () => {
      if (score.textContent === '0') {
        score.textContent = '';
      }
    });

    /** Al perder foco, restaura 0 si quedó vacío */
    score.addEventListener('blur', () => {
      if (!score.textContent.trim()) {
        score.textContent = '0';
      }
    });

    /** Bloquea teclas no numéricas */
    score.addEventListener('keydown', e => {
      const ok = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];
      if (!ok.includes(e.key) && !/^\d$/.test(e.key)) {
        e.preventDefault();
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        score.blur();
      }
    });

    /** Bloquea pegado con formato */
    score.addEventListener('paste', e => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      const num = txt.replace(/\D/g, '').slice(0, 2);
      document.execCommand('insertText', false, num);
    });

  });
}

function moverCursorAlFinal(el) {
  if (!el.textContent.length) return;
  const sel   = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

/**
 * Toggle del panel admin.
 * CRÍTICO: Usa style.display directamente para evitar conflictos
 * con cualquier regla CSS que tenga display:none !important.
 */
function togglePanelAdmin() {
  const panel = document.getElementById('adminPanel');

  if (panelAbierto) {
    // CERRAR
    panel.style.display = 'none';
    panel.setAttribute('aria-hidden', 'true');
    panelAbierto = false;
  } else {
    // ABRIR con animación
    panel.style.display = 'flex';
    panel.setAttribute('aria-hidden', 'false');
    // Forzar reflow para reiniciar la animación CSS
    void panel.offsetWidth;
    panel.style.animation = 'none';
    void panel.offsetWidth;
    panel.style.animation = '';
    panelAbierto = true;
  }
}

// Exponer globalmente (se llama desde atributos onclick en el HTML)

/* ── Selectores del panel ── */

function llenarSelectorPartidos() {
  const sel = document.getElementById('adminPartidoSel');
  sel.innerHTML = '<option value="">— Selecciona partido —</option>';
  for (let i = 0; i < 9; i++) {
    const p   = document.querySelectorAll('.partido')[i];
    const loc = p ? shortEquipo(p.dataset.local)  : `Local ${i + 1}`;
    const vis = p ? shortEquipo(p.dataset.visita) : `Visita ${i + 1}`;
    const opt = document.createElement('option');
    opt.value       = i;
    opt.textContent = `${i + 1}. ${loc} vs ${vis}`;
    sel.appendChild(opt);
  }
}

function llenarSelectorEquipos() {
  ['apLocal', 'apVisita'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    // Ordenar alfabéticamente por nombre
    [...EQUIPOS].sort((a, b) => a.nombre.localeCompare(b.nombre)).forEach(e => {
      const opt = document.createElement('option');
      opt.value       = e.id;
      opt.textContent = e.nombre;
      sel.appendChild(opt);
    });
  });
}

/** Rellena los 4 selects de canal del formulario admin */
function llenarSelectorCanales() {
  ['apCanal1', 'apCanal2', 'apCanal3', 'apCanal4'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '<option value="">— Ninguno —</option>';
    CANALES.forEach(c => {
      const opt = document.createElement('option');
      opt.value       = c.id;
      opt.textContent = c.nombre;
      sel.appendChild(opt);
    });

}

/* ── Aplicar cambios al partido ── */
function aplicarCampoPartido() {
  const idx = parseInt(document.getElementById('adminPartidoSel').value);
  if (isNaN(idx)) return;

  const partido = document.querySelectorAll('.partido')[idx];
  if (!partido) return;

  const fecha  = document.getElementById('apFecha').value;
  const hora   = document.getElementById('apHora').value;
  const local  = document.getElementById('apLocal').value;
  const visita = document.getElementById('apVisita').value;

  const canales = ['apCanal1', 'apCanal2', 'apCanal3', 'apCanal4']
    .map(id => document.getElementById(id).value)
    .filter(Boolean)
    .slice(0, 4);

  // Preservar scores actuales
  const scores      = partido.querySelectorAll('.score');
  const scoreLocal  = scores[0]?.textContent || '0';
  const scoreVisita = scores[1]?.textContent || '0';

  // Actualizar datos en dataset
  partido.dataset.fecha    = fecha;
  partido.dataset.hora     = hora;
  partido.dataset.local    = local;
  partido.dataset.visita   = visita;
  partido.dataset.canales  = JSON.stringify(canales);

  /* ── Actualizar DOM de la fila info ── */
  const fechaEl = partido.querySelector('.p-fecha');
  const horaEl  = partido.querySelector('.p-hora');
  const sepEl   = partido.querySelector('.p-sep');
  const canalesCont = partido.querySelector('.p-canales-container');

  if (fechaEl) fechaEl.textContent = formatFecha(fecha);

  if (hora) {
    if (horaEl) {
      horaEl.textContent = formatHora(hora);
      horaEl.style.display = '';
      if (sepEl) sepEl.style.display = '';
    } else {
      // Crear elementos de hora si no existían
      const sep = document.createElement('span');
      sep.className   = 'p-sep';
      sep.textContent = '·';
      const h = document.createElement('span');
      h.className   = 'p-hora';
      h.textContent = formatHora(hora);
      if (fechaEl) fechaEl.after(sep, h);
    }
  } else if (horaEl) {
    horaEl.style.display = 'none';
    if (sepEl) sepEl.style.display = 'none';
  }

  if (canalesCont) {
    canalesCont.innerHTML = canalesHTML(canales);
  }

  /* ── Actualizar logos y nombres de equipos ── */
  const localImgs  = partido.querySelectorAll('.equipo-local  img');
  const visitaImgs = partido.querySelectorAll('.equipo-visita img');
  const localFall  = partido.querySelector('.equipo-local  .equipo-fallback');
  const visitaFall = partido.querySelector('.equipo-visita .equipo-fallback');
  const localNom   = partido.querySelector('.equipo-local  .equipo-nombre');
  const visitaNom  = partido.querySelector('.equipo-visita .equipo-nombre');

  if (localImgs[0]) {
    delete localImgs[0].dataset.fallback;
    localImgs[0].src    = logoEquipo(local);
    localImgs[0].alt    = nombreEquipo(local);
    localImgs[0].title  = nombreEquipo(local);
    localImgs[0].style.display = 'block';
    if (localFall) localFall.style.display = 'none';
  }

  if (visitaImgs[0]) {
    delete visitaImgs[0].dataset.fallback;
    visitaImgs[0].src   = logoEquipo(visita);
    visitaImgs[0].alt   = nombreEquipo(visita);
    visitaImgs[0].title = nombreEquipo(visita);
    visitaImgs[0].style.display = 'block';
    if (visitaFall) visitaFall.style.display = 'none';
  }

  if (localNom)  localNom.textContent  = nombreEquipo(local);
  if (visitaNom) visitaNom.textContent = nombreEquipo(visita);

  // Restaurar scores
  const newScores = partido.querySelectorAll('.score');
  if (newScores[0]) newScores[0].textContent = scoreLocal;
  if (newScores[1]) newScores[1].textContent = scoreVisita;

  // Actualizar selector de partidos con nuevos nombres
  llenarSelectorPartidos();
  document.getElementById('adminPartidoSel').value = idx;

  // Guardar en Firebase (documento aislado por QUINIELA_ID)
  guardarDatosAdmin(obtenerEstadoActual());
}

/* ══════════════════════════════════════════════════════════
   9. EXPORTACIÓN PNG — versión robusta para móvil
   ──────────────────────────────────────────────────────────
   Problema original: en celular, #quiniela vive dentro de
   main { max-width: 880px } y en pantallas angostas el layout
   real es ~360px, así que html2canvas capturaba una imagen
   angosta. Además <a download> no funciona de forma confiable
   en Safari iOS / algunos navegadores Android.

   Solución:
   1. prepararCaptura() fuerza main y #quiniela a 1080px de
      ancho real (no solo windowWidth de html2canvas), cierra
      el panel admin y "congela" los scores.
   2. capturarCanvas() usa html2canvas con width/windowWidth
      fijos en 1080 para que la captura sea siempre ancha,
      tanto en PC como en celular.
   3. compartirODescargar() intenta primero la Web Share API
      (abre la hoja nativa de WhatsApp / Guardar en Fotos) y
      solo si no está disponible o falla, cae a la descarga
      clásica con <a download>.
   4. restaurarCaptura() regresa todo a su estado normal.
══════════════════════════════════════════════════════════ */

/** Prepara el DOM para la captura y devuelve el estado previo para restaurar */
function prepararCaptura(quiniela) {
  document.body.classList.add('modo-imagen');

  if (panelAbierto) togglePanelAdmin();

  const scores = quiniela.querySelectorAll('.score');
  const valoresScores = Array.from(scores).map(s => s.textContent);
  scores.forEach(s => {
    s.contentEditable = false;
    s.blur();
    s.style.pointerEvents = 'none';
  });

  const main = document.querySelector('main');

  const prev = {
    mainWidth:    main.style.width,
    mainMaxWidth: main.style.maxWidth,
    qWidth:       quiniela.style.width,
    qMaxWidth:    quiniela.style.maxWidth,
    qMinWidth:    quiniela.style.minWidth,
    valoresScores,
  };

  main.style.width      = '1080px';
  main.style.maxWidth   = '1080px';
  quiniela.style.width    = '1080px';
  quiniela.style.maxWidth = '1080px';
  quiniela.style.minWidth = '1080px';

  return prev;
}

/** Restaura el DOM al estado que tenía antes de prepararCaptura() */
function restaurarCaptura(quiniela, prev) {
  const main = document.querySelector('main');

  main.style.width    = prev.mainWidth;
  main.style.maxWidth = prev.mainMaxWidth;

  quiniela.style.width    = prev.qWidth;
  quiniela.style.maxWidth = prev.qMaxWidth;
  quiniela.style.minWidth = prev.qMinWidth;

  const scores = quiniela.querySelectorAll('.score');
  scores.forEach((s, i) => {
    s.contentEditable = true;
    s.textContent = prev.valoresScores[i] ?? s.textContent;
    s.style.pointerEvents = '';
  });

  document.body.classList.remove('modo-imagen');
}

/** Pequeña espera para que el navegador aplique el nuevo layout antes de capturar */
function esperarLayout(ms = 300) {
  return new Promise(r => setTimeout(r, ms));
}

/** Genera el canvas con html2canvas usando un ancho fijo de 1080px */
function capturarCanvas(quiniela, scale) {
  return html2canvas(quiniela, {
    scale,
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#ffffff',
    windowWidth: 1080,
    width: 1080,
    foreignObjectRendering: false,
    imageTimeout: 15000,
  });
}

/**
 * Intenta abrir la hoja nativa de compartir (WhatsApp, Guardar en Fotos, etc.)
 * usando la Web Share API con archivos. Si no está disponible, el usuario
 * cancela, o falla por cualquier motivo, cae a la descarga clásica.
 * Devuelve 'share', 'descarga' o 'cancelado'.
 */
async function compartirODescargar(blob, nombreArchivo, titulo, texto) {
  const file = new File([blob], nombreArchivo, { type: 'image/png' });

  try {
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ title: titulo, text: texto, files: [file] });
      return 'share';
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return 'cancelado';
    console.error('No se pudo compartir, se intentará descargar:', err);
  }

  // Fallback: descarga clásica
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return 'descarga';
}

/* ── Botón Guardar ── */
document.getElementById('btnGuardar').addEventListener('click', exportarPNG);

async function exportarPNG() {
  const quiniela = document.getElementById('quiniela');
  const btn = document.getElementById('btnGuardar');
  const textoOriginal = btn.innerHTML;

  btn.innerHTML = 'Guardando...';
  btn.disabled = true;

  const nombre = document.getElementById('nombreJugador').textContent.trim() || 'jugador';
  const nombreArchivo = `quiniela-${nombre.toLowerCase()}.png`;
  const esMovil = window.innerWidth < 700;
  const scale = esMovil ? 2 : 3;

  const prev = prepararCaptura(quiniela);

  try {
    await esperarLayout(300);

    const canvas = await capturarCanvas(quiniela, scale);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));

    if (!blob) throw new Error('No se pudo generar la imagen');

    const resultado = await compartirODescargar(
      blob,
      nombreArchivo,
      'Mi Quiniela Liga MX',
      `🏆 Quiniela de ${nombre} - Apertura 2026`
    );

    if (resultado === 'share') {
      toast('✅ Imagen lista — elige "Guardar en Fotos" o compártela');
    } else if (resultado === 'descarga') {
      toast('✅ Imagen descargada\nMantén presionada la imagen → Guardar en Fotos');
    }

  } catch (err) {
    console.error(err);
    toast('❌ Error al guardar imagen');
  } finally {
    restaurarCaptura(quiniela, prev);
    btn.innerHTML = textoOriginal;
    btn.disabled = false;
  }
}

function setFechaGeneracion() {
  const el = document.getElementById('q-fecha-gen');
  if (!el) return;
  el.textContent = new Date().toLocaleDateString('es-MX', {
    day: 'numeric', month: 'long', year: 'numeric',
  });
}

async function init() {
  // Cargar configuración desde Firebase (documento aislado: config-v5)
  const guardado = await cargarDatosAdmin();

  let partidos = PARTIDOS_DEFAULT;
  let titulo   = 'JORNADA 1';

  if (guardado) {
    if (Array.isArray(guardado.partidos) && guardado.partidos.length === 9) {
      // Migración: partidos antiguos guardados con "canal" (string)
      // se convierten a "canales" (array) sin perder datos.
      partidos = guardado.partidos.map(p => ({
        ...p,
        canales: normalizarCanales(p),
      }));
    }
    if (guardado.titulo) {
      titulo = guardado.titulo;
    }
  }

  document.getElementById('tituloJornada').textContent = titulo;
  renderPartidos(partidos);
  setFechaGeneracion();

  modal.style.display = 'flex';
  setTimeout(() => inputNombre.focus(), 150);
}

// ¡Arrancar!
init();
